<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
  <title>AI-Native Team OS 体系全景</title>
  <desc>旗舰 ai-native-team 居中，向下调度模型/方法/知识/编排四层组件，向上交付到两个桌面软件；kb-cli 为被 llm-wiki 取代的早期原型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="44" width="600" height="54" rx="10" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="56" y="63" font-size="12" font-weight="400" fill="#B4B2A9" dominant-baseline="central">交付层 · Electron · 含内部经营数据（不对外）</text>
  <text x="56" y="83" font-size="14" font-weight="500" fill="#F1EFE8" dominant-baseline="central">经营决策平台 · AI 调度运维工作台</text>
  <path d="M340 150 L340 104" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="127" font-size="12" font-weight="400" fill="#EF9F27" dominant-baseline="central">交付业务结果</text>
  <rect x="40" y="150" width="600" height="76" rx="12" fill="#633806" stroke="#EF9F27" stroke-width="1"/>
  <text x="56" y="170" font-size="12" font-weight="400" fill="#EF9F27" dominant-baseline="central">旗舰 · 组织与编排层（本仓库）</text>
  <text x="56" y="192" font-size="15" font-weight="500" fill="#FAC775" dominant-baseline="central">AI-Native Team OS</text>
  <text x="56" y="214" font-size="12" font-weight="400" fill="#EF9F27" dominant-baseline="central">智能路由 / 三层拆解 / 四闸校验 / 蓝图门禁 / 真调验收</text>
  <path d="M340 226 L340 296" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="261" font-size="12" font-weight="400" fill="#EF9F27" dominant-baseline="central">调度 · 编排 · 驱动</text>
  <rect x="40" y="300" width="135" height="60" rx="10" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="107" y="322" font-size="14" font-weight="500" fill="#F1EFE8" text-anchor="middle" dominant-baseline="central">sensenova-gateway</text>
  <text x="107" y="344" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">模型网关</text>
  <rect x="195" y="300" width="135" height="60" rx="10" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="262" y="322" font-size="14" font-weight="500" fill="#F1EFE8" text-anchor="middle" dominant-baseline="central">prompt-craft</text>
  <text x="262" y="344" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">提示词方法论</text>
  <rect x="350" y="300" width="135" height="60" rx="10" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="417" y="322" font-size="14" font-weight="500" fill="#F1EFE8" text-anchor="middle" dominant-baseline="central">llm-wiki</text>
  <text x="417" y="344" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">LLM×RAG 知识库</text>
  <rect x="505" y="300" width="135" height="60" rx="10" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="572" y="322" font-size="14" font-weight="500" fill="#F1EFE8" text-anchor="middle" dominant-baseline="central">LangGraph Demo</text>
  <text x="572" y="344" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">编排框架复刻</text>
  <text x="340" y="378" font-size="12" font-weight="400" fill="#888780" text-anchor="middle" dominant-baseline="central">kb-cli 为早期倒排检索原型，已被 llm-wiki 取代</text>
</svg>
